[project]
name = "nca4plot"
version = "0.1.0"
description = "A self-healing neural cellular automata Starry Night sky"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "onnx>=1.18",
  "onnxruntime>=1.22",
  "pillow>=11.0",
  "torch==2.9.1",
  "torchvision==0.24.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "playwright>=1.55",
  "imageio[ffmpeg]>=2.38.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nca4plot"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
